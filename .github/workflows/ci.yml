name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  TEST_PROJECT: tests/Fst.Tests/Fst.Tests.csproj

jobs:
  csharp:
    name: C# quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'global.json', 'NuGet.Config', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Check C# formatting
        shell: pwsh
        run: ./tools/Format-Code.ps1 -Check

      - name: Build Release
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore -warnaserror

      - name: Run offline regression tests
        run: dotnet run --project ${{ env.TEST_PROJECT }} --configuration Release --no-build

      - name: Linux backend transaction and lifecycle checks
        run: dotnet run --project tests/Fst.Linux.Platform.Tests/Fst.Linux.Platform.Tests.csproj -c Release

      - name: Windows loader integration checks
        if: matrix.os == 'windows-latest'
        run: dotnet run --project tests/Fst.Windows.Tests/Fst.Windows.Tests.csproj -c Release

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: csharp
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Windows installer
        shell: pwsh
        run: ./tools/Build-Setup.ps1

      - name: Verify installer payload
        shell: pwsh
        run: |
          $testExe = Join-Path $env:RUNNER_TEMP 'fst-payload/FST.exe'
          $setup = Start-Process './release/FST-Setup.exe' `
            -ArgumentList @('--verify-payload', ('"' + $testExe + '"')) `
            -Wait -PassThru

          if ($setup.ExitCode -ne 0) {
            throw 'Installer extraction failed'
          }

          if ((Get-FileHash $testExe).Hash -ne (Get-FileHash './dist-next/FST.exe').Hash) {
            throw 'Installer payload mismatch'
          }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fst-windows-x64
          path: release/FST-Setup.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: csharp
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build Linux artifacts
        run: bash tools/Build-Linux.sh

      - name: Verify packaged Linux backend
        run: bash tools/Test-Linux-Package.sh

      - name: Verify package checksums
        run: |
          cd release
          test -s SHA256SUMS-linux.txt
          sha256sum --check SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fst-linux-x86_64
          path: |
            release/*.pkg.tar.zst
            release/*.tar.gz
            release/PKGBUILD
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14
